[tool.poetry]
name = "claude-ci-tools"
version = "1.0.0"
description = "Claude-based tools for CI/CD environments"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "claude_ci_tools", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = {extras = ["bedrock"], version = "^0.40.0"}
PyGithub = "^2.1.1"
python-dotenv = "^1.0.0"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.12.1"
ruff = "^0.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
analyze-pr = "claude_ci_tools.analyze_pr:main"
test-local = "claude_ci_tools.test_local:main"
